<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>miBus! Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:Inter,sans-serif;

    background:
        linear-gradient(
            180deg,
            #F7F7F7 0%,
            #EEF4F1 100%
        );

    height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;
}

.login-card{

    width:360px;

    background:
        rgba(255,255,255,0.9);

    backdrop-filter:blur(18px);

    border-radius:36px;

    padding:40px;

    box-shadow:
        0 12px 36px rgba(0,0,0,0.08);

    text-align:center;
}

.logo{

    font-size:64px;

    margin-bottom:16px;
}

.title{

    font-size:38px;

    font-weight:800;

    color:#596273;

    margin-bottom:6px;
}

.title span{

    color:#A8D5C2;
}

.subtitle{

    color:#8A94A6;

    margin-bottom:30px;
}

input{

    width:100%;

    height:58px;

    border:none;

    border-radius:18px;

    background:#F7F7F7;

    padding:0 18px;

    margin-bottom:16px;

    font-size:16px;

    outline:none;
}

button{

    width:100%;

    height:62px;

    border:none;

    border-radius:22px;

    background:#596273;

    color:white;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    margin-top:10px;
}

</style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        🚌
    </div>

    <div class="title">
        <span>mi</span>Bus!
    </div>

    <div class="subtitle">
        Acceso conductor
    </div>

    <form method="POST">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Usuario">

        <input
            type="password"
            name="password"
            placeholder="Contraseña">

        <button type="submit">

            INGRESAR

        </button>

    </form>

</div>

</body>
</html>
